[workspace]
resolver = "3"
members = ["android", "cpp", "java"]

[workspace.dependencies]
bindgen = "0.72"
cfg-if = "1"
env_logger = { version = "0.11", default-features = false }
flapigen = { git = "https://github.com/Dushistov/flapigen-rs.git", rev = "49a59f68" }
# DIAGNOSTIC ONLY - DO NOT MERGE. Targets the branch carrying the webpki-roots TLS change so
# `connectedAndroidTest` exercises it. Restore the `version` requirement once that change is
# released. Do not add a `version` alongside `git`/`path` here: the branch is `4.4.2-pre.3`, and a
# pre-release is refused by `^4.4`, which silently left an earlier `[patch.crates-io]` unapplied.
ironoxide = { git = "https://github.com/IronCoreLabs/ironoxide", branch = "webpki-roots-test", features = [
    "blocking",
    "beta",
    "tls-rustls",
], default-features = false }
itertools = "0.14"
jni-sys = "0.3"
log = "0.4"
regex = "1.3"
serde_json = "1"
time = "0.3"

[profile.release]
lto = true

